name: Build Flet APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Forge Custom Signed ARM64 APK
        run: |
          pip install "flet>=0.21.0" pillow
          python -c "from PIL import Image; import os; p='assets/icon_raw'; Image.open(p).convert('RGBA').resize((512,512)).save('assets/icon.png') if os.path.exists(p) else None"
          flet build apk --project "omni56" --product "A-core" --org "com.zelalem" --split-per-abi --yes
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/apk/*arm64-v8a*.apk
